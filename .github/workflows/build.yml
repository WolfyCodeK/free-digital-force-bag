name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: notes-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # The compile classpath (library classes and the generated R classes), kept under a hidden
      # ref so the code can be type-checked without an Android SDK.
      - name: Publish the compile classpath to a hidden ref
        continue-on-error: true
        run: |
          mkdir -p cp && cd cp
          i=0
          for j in $(find ~/.gradle/caches -path '*transformed*' -name 'classes.jar') \
                   $(find ~/.gradle/caches/modules-2 -name '*.jar' \( -path '*androidx*' -o -path '*org.jetbrains.kotlin*kotlin-stdlib*' -o -path '*com.google.android.material*' -o -path '*com.google.guava*listenablefuture*' \) ! -name '*sources*'); do
            i=$((i+1)); cp "$j" "lib$i-$(basename "$(dirname "$(dirname "$j")")").jar"
          done
          find ../app/build -name 'R.jar' -path '*compile_and_runtime_not_namespaced_r_class_jar*' -exec cp {} R.jar \;
          ls | head -200
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Compile classpath for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/ci/${{ github.ref_name }}/classpath"
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest APK
          files: app/build/outputs/apk/debug/app-debug.apk

  # Boots an emulator, takes screenshots of every screen and tests the home-screen swipes.
  # The screenshots are uploaded as the "screenshots-apiNN" artifact of each run.
  # About 20 minutes per Android version, so only when asked for: a manual run, or a commit whose
  # message contains [test]. Every push still builds and publishes the APK (about 3 minutes).
  emulator:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notes-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python3 ci/drive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api${{ matrix.api }}
          path: ci-out/
      # Also keep the screenshots as one orphan commit under a hidden ref (not a branch), so they
      # can be fetched with plain git: git fetch origin refs/ci/<branch>/api34
      - name: Publish screenshots to a hidden ref
        if: always()
        run: |
          cd ci-out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${{ github.sha }} on API ${{ matrix.api }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/ci/${{ github.ref_name }}/api${{ matrix.api }}"
