plugins {
    id 'com.android.application'
}

android {
    namespace 'app.notes'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.wolfycodek.keepnotes'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
